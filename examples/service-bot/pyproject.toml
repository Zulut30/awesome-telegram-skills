[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-telegram-service-example"
version = "0.1.0"
description = "Persistent single-process service bot example"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["awesome-telegram-patterns[aiogram]>=0.24,<0.25"]

[project.scripts]
telegram-service-example = "telegram_service_example.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
