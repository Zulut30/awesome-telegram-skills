[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-telegram-group-example"
version = "0.1.0"
description = "Reviewed group operations with current permissions and crash recovery"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["awesome-telegram-patterns[aiogram]>=0.24,<0.25"]

[project.scripts]
telegram-group-example = "telegram_group_example.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
