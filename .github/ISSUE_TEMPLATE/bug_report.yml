name: Ошибка
description: Воспроизводимая проблема в компоненте, примере или скилле.
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Версия и среда
      description: Версия и способ установки, commit или SHA-256 артефакта, компонент или скилл, ОС, Python/Node, SDK и версия Telegram-клиента, если он участвует.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      description: Точная команда и последовательность действий, минимальный код с синтетическими данными, условия повтора или перезапуска. Токены, initData и session-файлы не публикуйте.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый и фактический результат
      description: Что ожидали, что произошло, какой лог или скриншот это подтверждает.
    validations:
      required: true
