name: Documentation Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s site/tests -v
      - run: python scripts/build_docs_site.py --source . --output output/docs-site --revision '${{ github.sha }}'
      - run: python scripts/verify_docs_site.py --site output/docs-site --report output/docs-site-check.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/docs-browser.mjs output/docs-site output/playwright/docs-site
        env:
          DOCS_BROWSER: chromium
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/docs-site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
