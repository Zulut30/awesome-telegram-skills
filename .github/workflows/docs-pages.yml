name: Documentation Pages

# Publishes the site from main. Pull requests build and check the same site in Repository checks (docs-site job)
# through the shared workflow docs-site.yml, so this workflow does not run for them.
on:
  push:
    branches: [main]
  # Daily, so the quality board follows CI even without new commits.
  schedule:
    - cron: '29 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment in progress is never cancelled: a newer push waits as the single
# pending run and publishes after it (an older pending run is replaced by the newer one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify documentation
    uses: ./.github/workflows/docs-site.yml
    permissions:
      actions: read
      contents: read
      pages: read
    with:
      pages-artifact: true

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
