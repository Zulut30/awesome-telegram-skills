name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_delivery:
        description: 'Also run the full delivery verifier (verify_pattern_packages.py) on Ubuntu and macOS'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML>=6,<7' 'skills-ref==0.1.1'
      - run: python scripts/validate_skills.py
      # Shared docs/ pages and their skill copies: edit the source, then run the script without --check.
      - run: python scripts/sync_skill_references.py --check
      # «Термины:» lines explain jargon in each reference; refresh with the script without --check.
      - run: python scripts/add_terms_lines.py --check
      # docs/capability-map.md is generated from catalog/capability-map.json and the recipe/component catalogs.
      - run: python scripts/build_capability_map.py --check
      - run: python scripts/build_native_signatures.py --check
      # Shop client types and decoders follow examples/shop/openapi.json; the server side is checked by the shop tests.
      - run: python scripts/build_openapi_types.py --check
      # Reference validator of the Agent Skills specification (agentskills.io).
      - run: for skill in .agents/skills/*/; do agentskills validate "$skill"; done
      - run: python -m unittest discover -s tests -v

  python-style:
    name: Python library style (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff==0.16.10'
      # Settings live in packages/python/pyproject.toml: 120 characters, quotes preserved, E/F/W/I rules.
      - run: ruff check packages/python
      - run: ruff format --check packages/python

  python-types:
    name: Python library types (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The SDKs of every extra are installed so mypy sees their real types.
      - run: python -m pip install 'mypy==2.4.0' 'aiogram==3.31.0' 'python-telegram-bot==22.8' 'cryptography==50.0.2' 'tzdata==2026.5'
      - run: python -m mypy --strict --follow-imports=silent packages/python/src/telegram_patterns

  python-unit:
    name: Python library unit tests (aiogram ${{ matrix.aiogram }}, 30 s budget)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The three latest aiogram minors; keep in sync with AIOGRAM_TESTED in telegram_patterns/diagnostics.py.
        aiogram: ['3.29.1', '3.30.0', '3.31.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install "aiogram==${{ matrix.aiogram }}" 'python-telegram-bot==22.8' 'cryptography==50.0.2' 'tzdata==2026.5' 'hypothesis==6.168.5'
      # In-process tests in parallel shards; any child process fails the run. The python-package job runs
      # every test, integration included, against a real install of the package.
      - run: python scripts/run_python_tests.py --unit --budget 30
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python/src

  python-package:
    name: Installed Python package, every test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # A real (non-editable) install with every extra: packaging mistakes such as a missing resource
      # file or entry point fail here, which source-tree runs with PYTHONPATH cannot notice.
      - run: python -m venv "$RUNNER_TEMP/package-env"
      - run: '"$RUNNER_TEMP/package-env/bin/python" -m pip install "./packages/python[aiogram,calendar,ptb,signature]" "hypothesis==6.168.5"'
      - name: The library comes from site-packages, not the checkout
        run: |
          "$RUNNER_TEMP/package-env/bin/python" -I -c "import telegram_patterns as t; assert 'site-packages' in t.__file__, t.__file__; print(t.__file__, t.__version__)"
      # Unit and integration tests (subprocesses, CLI, starters, multiprocessing) in parallel shards.
      - run: python scripts/run_python_tests.py --python "$RUNNER_TEMP/package-env/bin/python" --timeout 400

  python-coverage:
    name: Python library coverage (90% statements, full branches of guarded modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/python/src
      TELEGRAM_PATTERNS_TESTS: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'coverage==7.16.2' 'aiogram==3.31.0' 'python-telegram-bot==22.8' 'cryptography==50.0.2' 'tzdata==2026.5' 'hypothesis==6.168.5'
      - run: python -m coverage run --rcfile=packages/python/pyproject.toml -m unittest discover -s packages/python/tests
      - run: python -m coverage report --rcfile=packages/python/pyproject.toml --skip-covered --sort=cover
      - run: python -m coverage json --rcfile=packages/python/pyproject.toml -o coverage.json
      - run: python -m coverage html --rcfile=packages/python/pyproject.toml -d coverage-html
      # Thresholds live in scripts/check_coverage.py; falling below them fails the build.
      - run: python scripts/check_coverage.py coverage.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: |
            coverage.json
            coverage-html
          if-no-files-found: warn

  typescript:
    name: TypeScript tests and Mini App build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # React, Vue and Svelte examples over the bridge adapters: build and server-side render.
      - run: npm run test:frameworks

  mini-app-quality:
    name: Mini App performance, accessibility and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/mini-app-quality/package-lock.json
      - run: npm ci
      - run: npm run build
      # Lighthouse and axe live in their own lockfile so other jobs do not install them.
      - run: npm ci --prefix tools/mini-app-quality
      - run: npm test --prefix tools/mini-app-quality
      # Budgets in tools/mini-app-quality/budgets.json: performance >= 0.9, accessibility >= 0.95,
      # zero axe violations, script/stylesheet/request limits. Crossing one fails the build.
      - run: node tools/mini-app-quality/check.mjs output/mini-app-quality
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mini-app-quality
          path: output/mini-app-quality
          if-no-files-found: warn

  api-compatibility:
    name: Public API compatibility and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'aiogram>=3.29,<4' 'tzdata>=2026.5'
      - run: npm ci
      - run: python scripts/check_api_compatibility.py --base auto

  quickstart:
    name: Documented quickstart (${{ matrix.os }}, ${{ matrix.guide }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        guide: [docs/quickstart.md, docs/en/quickstart.md]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0'
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      # PowerShell blocks on Windows, bash blocks on Linux and macOS; Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_quickstart.py --guide '${{ matrix.guide }}' --wheel dist/*.whl --tarball dist/*.tgz --output output/quickstart

  examples:
    name: Example applications on the current library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0' 'uv==0.11.32'
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      - run: python scripts/verify_service_bot.py --wheel dist/*.whl --output output/service-bot
      - run: python scripts/verify_group_bot.py --wheel dist/*.whl --output output/group-bot
      # Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_shop_example.py --wheel dist/*.whl --tarball dist/*.tgz --output output/shop

  docker:
    name: Optional service-bot container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Engine and the Compose plugin are preinstalled on hosted Ubuntu runners.
      - run: docker compose version
      - run: python3 scripts/verify_docker_example.py

  delivery:
    name: Full delivery verification (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_delivery
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0' 'uv==0.11.32'
      - run: npm ci
      # Chrome is preinstalled on hosted runners; the verifier finds it on every OS.
      - run: python scripts/verify_pattern_packages.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-${{ matrix.os }}
          path: |
            output/pattern-library-*/*.json
            output/pattern-library-*/*.log
          if-no-files-found: ignore
