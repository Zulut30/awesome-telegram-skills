name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/skills.txt
      - run: python scripts/validate_skills.py
      # Reference validator of the Agent Skills specification (agentskills.io).
      - run: for skill in .agents/skills/*/; do agentskills validate "$skill"; done
      - run: python -m unittest discover -s tests -v

  generated-files:
    name: Generated files are current (every --check on the real tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The API reference and recipe gallery import the adapters and run demo Dispatchers locally, without network.
      - run: python -m pip install -r requirements/sdk.txt
      - run: python -m pip install --no-deps -e packages/python
      # Edit the source and rerun a script without --check; a stale generated file fails the build.
      # Shared docs/ pages and their skill copies.
      - run: python scripts/sync_skill_references.py --check
      # «Термины:» lines in skill references.
      - run: python scripts/add_terms_lines.py --check
      # docs/api-reference-*.md and catalog/api-reference-index.json from the public exports.
      - run: python scripts/build_api_reference.py --check
      # catalog/bot-api-*.json, packages/typescript/src/native-catalog.ts and the request fixtures.
      - run: python scripts/build_telegram_catalog.py --check
      # gallery/index.html, gallery data and the bundled resources/recipes.json and resources/request-fixtures.json.
      - run: python scripts/build_recipe_gallery.py --check
      # docs/capability-map.md from catalog/capability-map.json and the recipe and component catalogs.
      - run: python scripts/build_capability_map.py --check
      # packages/typescript/src/native-signatures.ts from catalog/mini-app-types.json.
      - run: python scripts/build_native_signatures.py --check
      # Shop client types and decoders from examples/shop/openapi.json.
      - run: python scripts/build_openapi_types.py --check
      - run: python scripts/build_docs_map.py --check
      - run: python scripts/build_acceptance_history.py --check

  history:
    name: Commit messages and CHANGELOG against tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/check_changelog.py
      # Pull requests: their own commits. Pushes to main were checked in their pull request (a squash commit
      # carries the pull request text), manual runs check the branch against main.
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            pull_request) python scripts/check_commit_messages.py --range "$BASE..$HEAD" ;;
            push) echo 'Commit messages of main were checked in their pull requests' ;;
            *) git fetch --no-tags origin main && python scripts/check_commit_messages.py --range origin/main..HEAD ;;
          esac

  python-style:
    name: Python library style (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/lint.txt
      # Settings live in packages/python/pyproject.toml: 120 characters, quotes preserved, E/F/W/I rules.
      - run: ruff check packages/python
      - run: ruff format --check packages/python

  python-types:
    name: Python library types (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The SDKs of every extra are installed so mypy sees their real types.
      - run: python -m pip install -r requirements/types.txt -r requirements/sdk.txt
      - run: python -m mypy --strict --follow-imports=silent packages/python/src/telegram_patterns

  python-unit:
    name: Python library unit tests (aiogram ${{ matrix.aiogram }}, 30 s budget)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The three latest aiogram minors; keep in sync with AIOGRAM_TESTED in telegram_patterns/diagnostics.py.
        aiogram: ['3.29.1', '3.30.0', '3.31.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/sdk.txt -r requirements/test.txt
      # The matrix replaces only aiogram; the other SDKs stay at requirements/sdk.txt.
      - run: python -m pip install "aiogram==${{ matrix.aiogram }}"
      # Editable install: code from the checkout, plus the distribution metadata that doctor reads.
      - run: python -m pip install --no-deps -e packages/python
      # In-process tests in parallel shards; any child process fails the run. The python-package job runs
      # every test, integration included, against a real install of the package.
      - run: python scripts/run_python_tests.py --unit --budget 30

  python-package:
    name: Installed Python package, every test (Python ${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11: the minimum and every newer minor run on Linux, the ends on Windows and macOS.
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # A real (non-editable) install with every extra into the fresh runner interpreter: packaging mistakes
      # such as a missing resource file or entry point fail here, which source-tree runs cannot notice.
      - run: python -m pip install "./packages/python[aiogram,calendar,ptb,signature]" -r requirements/test.txt
      - name: The library comes from site-packages, not the checkout
        run: python -I -c "import sys, telegram_patterns as t; assert 'site-packages' in t.__file__, t.__file__; print(sys.version, t.__file__, t.__version__)"
      # Unit and integration tests (subprocesses, CLI, starters, multiprocessing) in parallel shards.
      - run: python scripts/run_python_tests.py --timeout 400

  python-coverage:
    name: Python library coverage (90% statements, full branches of guarded modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_PATTERNS_TESTS: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/coverage.txt -r requirements/sdk.txt -r requirements/test.txt
      # Editable install: measured code stays in the checkout, doctor still finds the distribution metadata.
      - run: python -m pip install --no-deps -e packages/python
      - run: python -m coverage run --rcfile=packages/python/pyproject.toml -m unittest discover -s packages/python/tests
      - run: python -m coverage report --rcfile=packages/python/pyproject.toml --skip-covered --sort=cover
      - run: python -m coverage json --rcfile=packages/python/pyproject.toml -o coverage.json
      - run: python -m coverage html --rcfile=packages/python/pyproject.toml -d coverage-html
      # Thresholds live in scripts/check_coverage.py; falling below them fails the build.
      - run: python scripts/check_coverage.py coverage.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: |
            coverage.json
            coverage-html
          if-no-files-found: warn

  typescript:
    name: TypeScript tests and Mini App build (Node.js ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # engines is node >=20 (the Vite starter needs 20.19+, which the latest 20.x satisfies).
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # React, Vue and Svelte examples over the bridge adapters: build and server-side render.
      - run: npm run test:frameworks

  mini-app-quality:
    name: Mini App performance, accessibility and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/mini-app-quality/package-lock.json
      - run: npm ci
      - run: npm run build
      # Lighthouse and axe live in their own lockfile so other jobs do not install them.
      - run: npm ci --prefix tools/mini-app-quality
      - run: npm test --prefix tools/mini-app-quality
      # Budgets in tools/mini-app-quality/budgets.json: performance >= 0.9, accessibility >= 0.95,
      # zero axe violations, script/stylesheet/request limits. Crossing one fails the build.
      - run: node tools/mini-app-quality/check.mjs output/mini-app-quality
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mini-app-quality
          path: output/mini-app-quality
          if-no-files-found: warn

  browser:
    name: Browser tests (patterns, gallery, starters) in Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements/build.txt -r requirements-docs.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every browser stage uses Playwright's Chromium; with CI set the verifier refuses to skip them.
      - run: echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      # Wheel/tarball consumers with the patterns demo, recipe gallery, both starters and their Vite dev loop.
      - run: python scripts/verify_pattern_packages.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-tests
          path: |
            output/pattern-library-*/*.json
            output/pattern-library-*/*.log
            output/pattern-library-*/**/*.png
          if-no-files-found: warn

  docs-site:
    name: Documentation site
    # The same build, link and browser checks that Documentation Pages runs before publishing from main.
    uses: ./.github/workflows/docs-site.yml

  api-compatibility:
    name: Public API compatibility and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements/sdk.txt
      - run: npm ci
      - run: python scripts/check_api_compatibility.py --base auto

  quickstart:
    name: Documented quickstart (${{ matrix.os }}, ${{ matrix.guide }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        guide: [docs/quickstart.md, docs/en/quickstart.md]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements/build.txt
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      # PowerShell blocks on Windows, bash blocks on Linux and macOS; Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_quickstart.py --guide '${{ matrix.guide }}' --wheel dist/*.whl --tarball dist/*.tgz --output output/quickstart

  fresh-install:
    name: Install from scratch, wheel to offline bot (${{ matrix.os }}, Python 3.11)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The oldest supported Python; no Node.js: a Python bot needs only the wheel.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/build.txt
      - run: python -m build --wheel --outdir dist packages/python
      # Clean virtual environments, the telegram-patterns console command, init, offline.py and doctor.
      - run: python scripts/verify_fresh_install.py --wheel dist/*.whl --output output/fresh-install
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-install-${{ matrix.os }}
          path: output/fresh-install
          if-no-files-found: warn

  examples:
    name: Example applications on the current library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements/build.txt
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      - run: python scripts/verify_service_bot.py --wheel dist/*.whl --output output/service-bot
      - run: python scripts/verify_group_bot.py --wheel dist/*.whl --output output/group-bot
      # Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_shop_example.py --wheel dist/*.whl --tarball dist/*.tgz --output output/shop

  docker:
    name: Optional service-bot container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Engine and the Compose plugin are preinstalled on hosted Ubuntu runners.
      - run: docker compose version
      - run: python3 scripts/verify_docker_example.py

  required:
    name: Required checks passed
    # The one check to mark as required in branch protection: it fails when any job below failed, was
    # cancelled or skipped, so adding a job to `needs` is enough to make it block merging.
    if: always()
    needs: [skills, generated-files, history, python-style, python-types, python-unit, python-package, python-coverage, typescript, mini-app-quality, browser, docs-site, api-compatibility, quickstart, fresh-install, examples, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '::error::A required job did not succeed'
          exit 1
      - run: echo 'Every required job succeeded'
