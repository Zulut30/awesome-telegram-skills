name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_delivery:
        description: 'Also run the full delivery verifier (verify_pattern_packages.py) on Ubuntu and macOS'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML>=6,<7' 'skills-ref==0.1.1'
      - run: python scripts/validate_skills.py
      # Shared docs/ pages and their skill copies: edit the source, then run the script without --check.
      - run: python scripts/sync_skill_references.py --check
      # «Термины:» lines explain jargon in each reference; refresh with the script without --check.
      - run: python scripts/add_terms_lines.py --check
      # docs/capability-map.md is generated from catalog/capability-map.json and the recipe/component catalogs.
      - run: python scripts/build_capability_map.py --check
      # Reference validator of the Agent Skills specification (agentskills.io).
      - run: for skill in .agents/skills/*/; do agentskills validate "$skill"; done
      - run: python -m unittest discover -s tests -v

  python-style:
    name: Python library style (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff==0.16.10'
      # Settings live in packages/python/pyproject.toml: 120 characters, quotes preserved, E/F/W/I rules.
      - run: ruff check packages/python
      - run: ruff format --check packages/python

  typescript:
    name: TypeScript tests and Mini App build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  api-compatibility:
    name: Public API compatibility and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'aiogram>=3.31,<4' 'tzdata>=2026.5,<2027'
      - run: npm ci
      - run: python scripts/check_api_compatibility.py --base auto

  quickstart:
    name: Documented quickstart (${{ matrix.os }}, ${{ matrix.guide }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        guide: [docs/quickstart.md, docs/en/quickstart.md]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0'
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      # PowerShell blocks on Windows, bash blocks on Linux and macOS; Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_quickstart.py --guide '${{ matrix.guide }}' --wheel dist/*.whl --tarball dist/*.tgz --output output/quickstart

  examples:
    name: Example applications on the current library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0' 'uv==0.11.32'
      - run: npm ci
      - run: python scripts/build_release.py --ref HEAD --output dist
      - run: python scripts/verify_service_bot.py --wheel dist/*.whl --output output/service-bot
      - run: python scripts/verify_group_bot.py --wheel dist/*.whl --output output/group-bot
      # Chrome is preinstalled on hosted runners.
      - run: python scripts/verify_shop_example.py --wheel dist/*.whl --tarball dist/*.tgz --output output/shop

  docker:
    name: Optional service-bot container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Engine and the Compose plugin are preinstalled on hosted Ubuntu runners.
      - run: docker compose version
      - run: python3 scripts/verify_docker_example.py

  delivery:
    name: Full delivery verification (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_delivery
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0' 'uv==0.11.32'
      - run: npm ci
      # Chrome is preinstalled on hosted runners; the verifier finds it on every OS.
      - run: python scripts/verify_pattern_packages.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-${{ matrix.os }}
          path: |
            output/pattern-library-*/*.json
            output/pattern-library-*/*.log
          if-no-files-found: ignore
