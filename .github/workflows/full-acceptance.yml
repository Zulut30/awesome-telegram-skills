name: Full acceptance

# Every night, for every release tag and on demand: the full package verifier (wheel and tarball consumers,
# every Python and TypeScript test, starters, recipe gallery and all browser stages in Playwright Chromium)
# on Ubuntu and macOS. Reports and logs are attached to the run. A failed scheduled or tag run opens an
# issue, or comments on the one that is still open, so a broken night is never silent.
on:
  schedule:
    - cron: '23 2 * * *'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Full acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'build==1.3.0' 'uv==0.11.32'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: python scripts/verify_pattern_packages.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.os }}
          path: output/pattern-library-*/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Open or update the failure issue
    needs: acceptance
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          body="Full acceptance failed: $EVENT on $REF ($SHA). Reports and logs: $RUN_URL (artifacts acceptance-ubuntu-latest and acceptance-macos-latest)."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Full acceptance failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Full acceptance failed ($REF, $(date -u +%F))" --body "$body"
          fi
