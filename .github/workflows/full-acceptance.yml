name: Full acceptance

# Every night, for every release tag and on demand: the full package verifier (wheel and tarball consumers,
# every Python and TypeScript test, starters, recipe gallery and all browser stages in Playwright Chromium)
# on Ubuntu and macOS. Reports and logs are attached to the run; on a tag the Ubuntu report is also attached to
# the release. A failed scheduled or tag run opens an
# issue, or comments on the one that is still open, so a broken night is never silent.
on:
  schedule:
    - cron: '23 2 * * *'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Full acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements/build.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: python scripts/verify_pattern_packages.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.os }}
          path: output/pattern-library-*/
          if-no-files-found: warn
          retention-days: 30

  release-report:
    name: Attach the acceptance report to the release
    # Full reports live in release assets, not in the repository; docs/acceptance-history.json keeps one summary
    # line per report (scripts/build_acceptance_history.py --add). Only this short job gets a write token.
    needs: acceptance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name acceptance-ubuntu-latest --dir acceptance
          report=$(find acceptance -name distribution-report.json | head -n 1)
          test -n "$report"
          # The Release workflow of the same tag creates the release; wait for it instead of creating a second one.
          for attempt in $(seq 1 30); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" "$report#Acceptance report (distribution-report.json)" --repo "$GITHUB_REPOSITORY" --clobber
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/distribution-report.json"
          {
            echo "Acceptance report attached: $url"
            echo
            echo "SHA-256: $(sha256sum "$report" | cut -d' ' -f1)"
            echo
            echo "Add its summary line: python scripts/build_acceptance_history.py --add distribution-report.json --name ${TAG#v}-distribution.json --url $url"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Open or update the failure issue
    needs: acceptance
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          body="Full acceptance failed: $EVENT on $REF ($SHA). Reports and logs: $RUN_URL (artifacts acceptance-ubuntu-latest and acceptance-macos-latest)."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Full acceptance failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Full acceptance failed ($REF, $(date -u +%F))" --body "$body"
          fi
