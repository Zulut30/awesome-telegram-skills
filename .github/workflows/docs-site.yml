name: Documentation site

# Shared build and checks of the documentation site. Repository checks call it for every pull request and push
# (docs-site job); Documentation Pages calls it on main and then deploys the uploaded Pages artifact.
# The GITHUB_TOKEN permissions come from the calling job: actions: read for the quality board, pages: read for Pages.
on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload output/docs-site as the GitHub Pages artifact for a deploy job of the caller
        type: boolean
        default: false

jobs:
  build:
    name: Build and verify the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s site/tests -v
      # Quality board: repository numbers plus the CI ones from the GitHub API (needs actions: read from the caller).
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_quality_board.py --ci --repo "$GITHUB_REPOSITORY" --output output/quality-board.json
      - run: python scripts/build_docs_site.py --source . --output output/docs-site --revision '${{ github.sha }}' --quality output/quality-board.json
      - run: python scripts/verify_docs_site.py --site output/docs-site --report output/docs-site-check.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/docs-browser.mjs output/docs-site output/playwright/docs-site
        env:
          DOCS_BROWSER: chromium
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-checks
          path: |
            output/docs-site-check.json
            output/quality-board.json
            output/playwright/docs-site
          if-no-files-found: warn
      - if: inputs.pages-artifact
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/docs-site
