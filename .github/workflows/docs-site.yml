name: Documentation site

# Shared build and checks of the documentation site. Repository checks call it for every pull request and push
# (docs-site job); Documentation Pages calls it on main and then deploys the uploaded Pages artifact.
# The GITHUB_TOKEN permissions come from the calling job: Pages needs pages: read, the checks only contents: read.
on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload output/docs-site as the GitHub Pages artifact for a deploy job of the caller
        type: boolean
        default: false

jobs:
  build:
    name: Build and verify the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s site/tests -v
      - run: python scripts/build_docs_site.py --source . --output output/docs-site --revision '${{ github.sha }}'
      - run: python scripts/verify_docs_site.py --site output/docs-site --report output/docs-site-check.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/docs-browser.mjs output/docs-site output/playwright/docs-site
        env:
          DOCS_BROWSER: chromium
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-checks
          path: |
            output/docs-site-check.json
            output/playwright/docs-site
          if-no-files-found: warn
      - if: inputs.pages-artifact
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/docs-site
