name: Publish to registries

# Uploads the artifacts of a published GitHub Release to PyPI and npm with
# trusted publishing (OIDC): no long-lived tokens are stored in the repository.
# Disabled until the owner registers the trusted publishers and sets the
# repository variable PUBLISH_TO_REGISTRIES=true (see docs/releasing.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.25.0'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Download and verify release artifacts
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      npm_tag: ${{ steps.tag.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from scripts.build_release import validate_tag
          release = validate_tag(os.environ['TAG'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'tag={release.tag}\n')
              stream.write('npm_tag=' + ('rc' if release.is_prerelease else 'latest') + '\n')
          PY
      - name: Require acceptance reports from the selected tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python scripts/device_report.py bundle --ref "$TAG" --output acceptance
          python scripts/live_acceptance.py bundle --ref "$TAG" --output acceptance
      - name: Download and check SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json, os, subprocess, tomllib
          from pathlib import Path
          from scripts.build_release import validate_tag
          release = validate_tag(os.environ['TAG'])
          def manifest(path):
              return subprocess.run(['git', 'show', f'{release.tag}:{path}'], check=True,
                  capture_output=True, text=True).stdout
          python = tomllib.loads(manifest('packages/python/pyproject.toml'))['project']
          npm = json.loads(manifest('packages/typescript/package.json'))
          expected = {release.wheel_filename(python['name']), release.npm_tarball_filename(npm['name'])}
          actual = {path.name for path in Path('dist').iterdir() if path.suffix in {'.whl', '.tgz'}}
          if actual != expected:
              raise SystemExit('Downloaded artifact basenames differ from the committed release identity')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/awesome-telegram-patterns/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/
      - run: find dist -type f ! -name '*.whl' -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: Publish to npm
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@awesome-telegram/patterns
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; provenance is attached automatically.
      - run: npm install -g npm@11
      - env:
          DIST_TAG: ${{ needs.artifacts.outputs.npm_tag }}
        run: npm publish dist/*.tgz --access public --tag "$DIST_TAG"
