name: Release

# A pushed canonical numeric/RC tag publishes a GitHub Release with the wheel, npm tarball and
# SHA256SUMS built from that tag. A manual run publishes existing tags that have
# no release yet (for example tags created before this workflow existed).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tags:
        description: 'Existing tags separated by spaces, e.g. "v0.13.0 v0.14.0"; empty means every tag without a release'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements/build.txt
      - name: Create missing tags from .github/release-tags.json
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, re, subprocess
          from scripts.build_release import ref_identity
          from scripts.release_identity import parse_release_tag
          for entry in json.load(open('.github/release-tags.json', encoding='utf-8'))['tags']:
              tag, version, commit = entry['tag'], entry['version'], entry['commit']
              release = parse_release_tag(tag)
              if release.is_prerelease or version != release.identity or not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise SystemExit('Historical backfill requires canonical numeric identities and full commits')
              if subprocess.run(['git', 'rev-parse', '--verify', '--quiet', f'refs/tags/{tag}'], capture_output=True).returncode == 0:
                  continue
              if ref_identity(commit).identity != release.identity:
                  raise SystemExit(f'{commit} is not version {version} in both manifests')
              subprocess.run(['git', 'tag', '-a', tag, commit, '-m', f'awesome-telegram-patterns {version}'], check=True)
              subprocess.run(['git', 'push', 'origin', f'refs/tags/{tag}'], check=True)
              print('created', tag)
          PY
      - name: Select tags
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'push' && github.ref_name || inputs.tags }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from scripts.build_release import validate_tag
          from scripts.release_identity import parse_release_tag
          tags = os.environ['REQUESTED'].split()
          if not tags:
              published = {entry['tagName'] for entry in json.loads(subprocess.run(
                  ['gh', 'release', 'list', '--limit', '1000', '--json', 'tagName'],
                  check=True, capture_output=True, text=True).stdout)}
              tags = [tag for tag in subprocess.run(['git', 'tag', '--list', 'v*.*.*'],
                  check=True, capture_output=True, text=True).stdout.split() if tag not in published]
              tags.sort(key=lambda tag: parse_release_tag(tag).precedence_key)
          for tag in tags:
              validate_tag(tag)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('tags=' + ' '.join(tags) + '\n')
          PY
      - name: Build from each tag
        env:
          TAGS: ${{ steps.select.outputs.tags }}
        run: |
          mkdir -p dist
          for tag in $TAGS; do
            python - "$tag" <<'PY'
          import sys
          from scripts.build_release import validate_tag
          validate_tag(sys.argv[1])
          PY
            # The release notes come from CHANGELOG: the tag must have its own section.
            python scripts/check_changelog.py --tag "$tag"
            python scripts/build_release.py --ref "$tag" --output "dist/$tag"
            python scripts/build_release.py --ref "$tag" --notes > "dist/$tag.md"
            # Device check report from the tag (docs/device-qa-checklist.md): required from 0.25.0, attached as
            # device-report-<version>.zip with screenshots; its table goes into the release notes.
            python scripts/device_report.py bundle --ref "$tag" --output "dist/$tag"
            # Live acceptance in the Telegram test environment (docs/live-acceptance.md): required from 0.25.0,
            # attached as live-report-<version>.zip; its table goes into the release notes too.
            python scripts/live_acceptance.py bundle --ref "$tag" --output "dist/$tag"
            for summary in dist/"$tag"/device-report-*.md dist/"$tag"/live-report-*.md; do
              if [ -f "$summary" ]; then printf '\n' >> "dist/$tag.md"; cat "$summary" >> "dist/$tag.md"; fi
            done
          done
      - name: Attest build provenance
        if: steps.select.outputs.tags != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*/*.whl, dist/*/*.tgz, dist/*/*.cdx.json'
      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.select.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if gh release view "$tag" >/dev/null 2>&1; then
              # Existing bytes are immutable: matching assets stay, conflicts require a new version.
              python scripts/release_assets.py --directory "dist/$tag" --repo "$GITHUB_REPOSITORY" --tag "$tag"
            else
              # 0.x remains experimental; every RC also stays a prerelease.
              prerelease=$(python - "$tag" <<'PY'
          import sys
          from scripts.release_identity import parse_release_tag
          release = parse_release_tag(sys.argv[1])
          print('yes' if release.major == 0 or release.is_prerelease else 'no')
          PY
              )
              flags=()
              if [ "$prerelease" = yes ]; then flags+=(--prerelease); fi
              gh release create "$tag" dist/"$tag"/* --verify-tag "${flags[@]}" --title "$tag" --notes-file "dist/$tag.md"
            fi
          done
