name: Sources review

# Every quarter: how old each skill's source check is, what the live sources say (Bot API and aiogram versions,
# Crypto Pay API hosts) and which source links fail. The result becomes an issue with a checklist; dates in
# skills and docs/sources.md change only after a person has re-checked the content (docs/sources.md).
on:
  schedule:
    - cron: '17 6 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Quarterly sources review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/sources_review.py --output output/sources-review.json --markdown output/sources-review.md
      # Links that fail are listed for the reviewer; the run itself stays green.
      - run: python scripts/check_skill_sources.py --online --output output/source-links.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources-review
          path: output/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          quarter="$(date -u +%Y)-Q$(( ($(date -u +%-m) - 1) / 3 + 1 ))"
          title="Sources review $quarter"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "$title already exists"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file output/sources-review.md
          fi
