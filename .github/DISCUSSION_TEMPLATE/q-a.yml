title: "[Вопрос]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ответ мейнтейнера — в течение 3 рабочих дней ([SUPPORT.md](https://github.com/Zulut30/awesome-telegram-skills/blob/main/SUPPORT.md)). Не публикуйте токены, `initData` и личные данные.
  - type: textarea
    id: question
    attributes:
      label: Вопрос
      description: Что хотите сделать и что мешает?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Версии и среда
      description: telegram-patterns --version, ОС, Python или Node.js, версия aiogram.
    validations:
      required: true
